# Copy this file to config.yaml (gitignored) and fill in the values below.

base_url: "http://localhost:3000"

# Numeric PrairieLearn course_instance id, e.g. from the URL
# http://localhost:3000/pl/course_instance/<this number>/instructor/...
course_instance_id: null

# Numeric PrairieLearn assessment id, e.g. from the URL
# http://localhost:3000/pl/course_instance/.../instructor/assessment/<this number>/...
assessment_id: null

# Number of distinct instances to generate when running the fetch script.
n_instances: 3

# Directory (relative to the repo root, unless absolute) where fetched
# blank/key HTML is saved, one subfolder per assessment_instance_id.
output_dir: "output"

# Path to the instructor-supplied docx template used when rendering. Generate a
# starting point with `pl2docx-starter-template` (python -m pl2docx.starter_template),
# then customize its styles/layout in Word.
template_path: "template.docx"

# Phase 3B: per-element formatting preferences (all keys optional; omitting this
# section entirely applies built-in defaults for every widget kind). See
# pl2docx.element_config for the full field reference.
#
# global-element-preferences:
#   pl-multiple-choice:
#     list-style: bubble        # letter-labels | bubble (default) | checkbox
#     bold-correct: true        # bold the correct option in the answer key
#     display: null              # inline | block | template | none | (auto-detect)
#     draw-border: false        # box the whole widget (all options together)
#   pl-checkbox:
#     list-style: checkbox      # letter-labels | bubble | checkbox (default)
#     bold-correct: true
#     display: null
#     draw-border: false
#   pl-string-input:
#     display: null              # inline | block (default when undetectable) | template | none
#     draw-border: false
#   pl-integer-input:
#     display: null
#     draw-border: false
#
# additional-elements:
#   pl-scinum-input:
