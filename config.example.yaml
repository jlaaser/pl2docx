# Copy this file to config.yaml (gitignored) and fill in the values below.
#
# For a full field-by-field reference, see notes/configuration.md.

base_url: "http://localhost:3000"

# Identify the target course/course-instance/assessment by their stable,
# human-authored PL identifiers, not numeric database ids (numeric ids on a local
# dev server can change between restarts; these stable identifiers won't).

# A course's short_name (its infoCourse.json "shortName"), e.g. "CHEM 0110". Shown,
# colon-separated from the title, on the PL homepage's course list.
course_short_name: null

# A course instance's short_name (its infoCourseInstance.json "shortName"), e.g.
# "Fall-2026". Shown as its own "Short name" column on
# /pl/course/<course_id>/course_admin/instances.
course_instance_short_name: null

# An assessment's tid - its directory name under assessments/ in the course repo,
# e.g. an assessment at assessments/midterm-1/infoAssessment.json has tid "midterm-1".
# Not the assessment's (editable) title.
assessment_tid: null

# Number of distinct instances to generate when running the fetch script.
# Ignored when instance_ids (below) is set.
n_instances: 3

# Optional: explicit instance labels, one instance generated per string, in this
# order - replaces n_instances entirely when set. Each label becomes the output
# folder name and the value of the instance_ID variable exposed to the docx
# template. When omitted, instance_ID defaults to "Instance 1", "Instance 2", etc.
#
# instance_ids:
#   - "Version A"
#   - "Version B"

# Directory (relative to wherever you run pl2docx from, unless absolute) where
# fetched HTML and generated docx files are saved, one subfolder per instance.
output_dir: "output"

# Path to the instructor-supplied docx template used when rendering. Generate a
# starting point with `pl2docx-starter-template`, then customize its styles/layout
# in Word.
template_path: "template.docx"

# Whether question numbering (1., 2., 3., ...) restarts at 1 at the beginning of
# every zone, instead of running continuously across the whole document (the
# default).
restart_numbering_per_zone: false

# Left indent (inches) for widgets whose content renders as its own block (a fresh
# paragraph or table) rather than sharing a line with prompt text. Set to 0 to
# disable.
block_display_indent_inches: 0.125

# Optional per-element formatting preferences, for PrairieLearn's built-in
# elements. All keys optional; omitting this section applies built-in defaults for
# every element. See notes/configuration.md for the full field reference.
#
# global-element-preferences:
#   pl-multiple-choice:
#     list-style: bubble        # letter-labels | bubble (default) | checkbox
#     bold-correct: true        # bold the correct option in the answer key
#     display: null              # inline | block | template | none | (auto-detect)
#     draw-border: false        # box the whole widget (all options together)
#     blank-answer-lines: 0      # blank lines in the blank copy's answer space
#   pl-string-input:
#     display: null
#     draw-border: false
#     default-label: null        # fallback label text (e.g. "Answer:"), only used
#                                 # when the element supplies no label of its own

# Optional: elements not built into pl2docx (typically course-specific ones) that
# should be treated like a built-in behavior class. See notes/configuration.md for
# the full field reference and the "interactive" type (for canvas-based widgets).
#
# additional-elements:
#   my-custom-input:
#     type: fill-in              # selector | fill-in | interactive
#     display: null
#     draw-border: false
#     blank-answer-lines: 10

# Extra LaTeX packages to load in every rendered math snippet's preamble, beyond
# pl2docx's small built-in default set (amsmath, amssymb, xcolor). Declare anything
# your course's questions need here (package names only, no .sty extension).
#
# latex-packages:
#   - mhchem
