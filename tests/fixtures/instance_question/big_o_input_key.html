<div class="question-block">
  <div class="card-header bg-primary text-white"><h1>Sample Big-O Question</h1></div>
  <div class="card-body question-body">
    <p>What is the tight worst-case running time of binary search on a sorted array of size n?</p>
    <span class="input-group big-o-input">
      <span class="input-group-text">O(</span>
      <input name="answer" type="text" autocomplete="off" autocorrect="off" class="form-control big-o-input-input" size="20" disabled value="log n">
      <span class="input-group-text">)</span>
    </span>
  </div>
</div>

  <div class="card-header bg-secondary text-white"><h2>Correct answer</h2></div>

    <p>The correct answer is <strong>O(log n)</strong>.</p>
  </div>
</div>
